name: Verify recovery package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.10"
      - run: uv sync --locked --dev
      - run: uv run python scripts/run_simulation_closure.py --output-root verification --previous-ref ad53d3e854419caf0bab6c3bff80ae2da6890ce9
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-summary-${{ matrix.python-version }}
          path: |
            verification/simulation-*/result.json
            verification/simulation-*/report.md
            verification/simulation-*/pytest.xml
            verification/simulation-*/static.txt
            verification/simulation-*/tests.txt
            verification/simulation-*/cpu-acceptance.txt
            verification/simulation-*/package.txt
            verification/simulation-*/wheel.txt
            verification/simulation-*/fresh-install.txt
            verification/simulation-*/upgrade-boundary.txt
          if-no-files-found: error
          retention-days: 90
      - if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-packages-${{ matrix.python-version }}
          path: |
            verification/simulation-*/dist/*.whl
            verification/simulation-*/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90
