name: Verify Linux startup identity

on:
  push:
    branches:
      - work/linux-cpu-diagnosis

permissions:
  contents: read

jobs:
  minimal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.10"
      - run: uv sync --locked --dev --quiet
      - name: Verify startup identity
        run: |
          uv run --no-sync python - <<'PY'
          from trainguard.environment import startup_identity_sha256
          try:
              identity = startup_identity_sha256()
          except Exception as exc:
              print(f"startup_identity=FAIL error_type={type(exc).__name__}")
              raise SystemExit(1)
          if not isinstance(identity, str) or len(identity) != 64:
              print("startup_identity=FAIL error_type=InvalidDigest")
              raise SystemExit(1)
          print("startup_identity=PASS")
          PY
      - name: Verify runtime identity tests
        if: always()
        run: |
          mkdir -p verification/simulation-diagnosis
          start=$SECONDS
          if uv run --no-sync pytest -q --tb=no             --basetemp=verification/simulation-diagnosis/runtime-artifacts             tests/test_runtime_identity.py > "$RUNNER_TEMP/runtime-identity.log" 2>&1; then
            echo "runtime_identity_tests=PASS elapsed_seconds=$((SECONDS-start))"
          else
            echo "runtime_identity_tests=FAIL elapsed_seconds=$((SECONDS-start))"
            exit 1
          fi
      - name: Verify synthetic benchmark test
        if: always()
        run: |
          mkdir -p verification/simulation-diagnosis
          start=$SECONDS
          if uv run --no-sync pytest -q --tb=no             --basetemp=verification/simulation-diagnosis/benchmark-artifacts             tests/test_benchmark.py::test_warmup_runs_are_validated_but_excluded_from_statistics             > "$RUNNER_TEMP/benchmark.log" 2>&1; then
            echo "synthetic_benchmark=PASS elapsed_seconds=$((SECONDS-start))"
          else
            echo "synthetic_benchmark=FAIL elapsed_seconds=$((SECONDS-start))"
            exit 1
          fi
      - name: Time support evidence test
        if: always() && matrix.python-version == '3.11'
        run: |
          mkdir -p verification/simulation-diagnosis
          start=$SECONDS
          if uv run --no-sync pytest -q --tb=no             --basetemp=verification/simulation-diagnosis/support-artifacts             tests/test_support.py::test_successful_support_and_measurement_recheck_bounded_event_evidence             > "$RUNNER_TEMP/support.log" 2>&1; then
            echo "support_evidence=PASS elapsed_seconds=$((SECONDS-start))"
          else
            echo "support_evidence=FAIL elapsed_seconds=$((SECONDS-start))"
            exit 1
          fi
