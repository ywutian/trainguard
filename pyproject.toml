[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "trainguard"
version = "0.3.4"
description = "Verified recovery experiments for distributed PyTorch training"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "Yitian Wu" }]
dependencies = [
    "numpy>=2,<3",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
    "torch==2.14.0",
    "typer>=0.19,<1",
]

[project.scripts]
trainguard = "trainguard.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/trainguard"]

[tool.hatch.build.targets.sdist]
only-include = [
    ".gitignore", "LICENSE", "README.md", "pyproject.toml", "uv.lock",
    "configs", "examples", "scripts", "src", "tests",
    "docs/commercial/customer-pilot-template.md",
    "docs/commercial/market-evidence-2026-09-26.md",
    "docs/commercial/operations-runbook.md",
    "docs/commercial/pilot-ledger-template.json",
    "docs/plans/product-closure-2026-09-26.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
