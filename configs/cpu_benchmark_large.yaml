run:
  seed: 42
  world_size: 2
  backend: gloo
  device: cpu

training:
  total_steps: 3000
  sequence_length: 16
  batch_size_per_rank: 2
  dataloader_workers: 0

model:
  vocab_size: 128
  hidden_size: 128
  num_heads: 4
  num_layers: 2
  dropout: 0.0

checkpoint:
  mode: none
  interval_steps: 100
