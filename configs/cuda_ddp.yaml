run:
  seed: 42
  world_size: 2
  backend: nccl
  device: cuda
  strategy: ddp
  deterministic: true
  timeout_seconds: 600
training:
  total_steps: 6
  sequence_length: 16
  batch_size_per_rank: 2
  dataloader_workers: 0
  prefetch_factor: 2
  gradient_accumulation_steps: 1
  precision: fp32
  max_consecutive_skips: 10
  loss_log_interval: 10
model:
  vocab_size: 128
  hidden_size: 64
  num_heads: 4
  num_layers: 1
  dropout: 0.2
checkpoint:
  mode: async
  interval_steps: 1
  poll_interval_steps: 5
  save_timeout_seconds: 120
  keep_last_k: null
  max_retained_bytes: null
recovery:
  max_restarts: 2
  progress_timeout_seconds: 120
  omit_state: none
fault:
  kind: none
  step: null
  rank: 0
  require_committed_step: null
data:
  kind: synthetic
  path: null
  sha256: null
  shuffle: true
  random_crop: false
